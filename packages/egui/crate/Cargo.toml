[package]
name = "nodalia-theme"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Nodalia Design Language for Rust: design tokens as constants and an egui style built from them."
repository = "https://github.com/danielmigueltejedor/nodalia-design"
publish = false

[features]
default = []
# Builds `egui::Style` and `egui::Visuals` from the tokens. Without it the crate has no dependencies.
egui = ["dep:egui"]
# The engineering suite's shared parts (`engineering`), with IBM Plex Sans and Mono embedded (~670 KB).
engineering = ["egui", "creator"]
# The creator suite's shared parts (`creator`): workspace selector, dialog buttons, Home rail, fields,
# and the About window (`about`) every egui app shares, whatever its suite.
creator = ["egui"]
# The enterprise suite's shared parts (`enterprise`): the window frame, top bar, sidebar, sign-in card
# and integration cards of Ágora, Hito and the apps to come.
enterprise = ["egui", "creator"]

[dependencies]
egui = { version = "0.37", default-features = false, optional = true }

# Standalone on purpose: apps take this crate as a git dependency into their own workspace.
[workspace]
